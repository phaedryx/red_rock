AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"
    - "test/fixtures/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Style/OneClassPerFile:
  Exclude:
    - "test/**/*"

# EntryFile#add_item edits a file and reports whether it could.
Naming/PredicateMethod:
  AllowedMethods:
    - call
    - add_item

Naming/MethodParameterName:
  MinNameLength: 1

Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/MethodLength:
  Max: 16
  CountAsOne: ["heredoc"]
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"
